# Despliegue GRATUITO: Render web Free + Neon PostgreSQL Free.
# No contiene contraseñas ni crea discos de pago.
services:
  - type: web
    name: cripta-pixel-online-v2
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: DATABASE_URL
        sync: false
